<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zhao Yun x Guan Yu - 30 s fight (HTML motion)</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=">
<style>
html,body{margin:0;width:100%;height:100%;background:#05070a;overflow:hidden;cursor:none}
#w{width:100%;height:100%;display:grid;place-items:center}
canvas{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));background:#0a1018;cursor:none}
</style></head><body><div id="w"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
(()=>{
const W=1920,H=1080,FPS=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const IMG={};const meta={};
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3), ei=t=>Math.pow(clamp(t),3), eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
// keyframes: [t, v...] -> interpolate with easing 'e' of segment end
function kf(tr,t){ if(t<=tr[0][0])return tr[0].slice(1); for(let i=1;i<tr.length;i++){ if(t<=tr[i][0]){const a=tr[i-1],b=tr[i],u=eio((t-a[0])/(b[0]-a[0])); return a.slice(1).map((v,k)=>lerp(v,b[k+1],u));}} return tr[tr.length-1].slice(1);}
function pose(list,t){let n=list[0][1];for(const [tt,nm] of list){if(t>=tt-1e-6)n=nm;}return n;}

function shadow(x,y,w,a=.5){ctx.save();ctx.translate(x,y);ctx.scale(1,.16);const g=ctx.createRadialGradient(0,0,0,0,0,w);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w,0,7);ctx.fill();ctx.restore();}
function arc(cx,cy,r,a0,a1,wd,c1,c2,al=1,ry=1){ // tapered crescent, additive
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=al;ctx.translate(cx,cy);ctx.scale(1,ry);
  const N=36;ctx.beginPath();
  for(let i=0;i<=N;i++){const u=i/N,a=lerp(a0,a1,u),w=wd*Math.sin(Math.PI*u)**0.8;const rr=r+w/2;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  for(let i=N;i>=0;i--){const u=i/N,a=lerp(a0,a1,u),w=wd*Math.sin(Math.PI*u)**0.8;const rr=r-w/2;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.closePath();const g=ctx.createLinearGradient(Math.cos(a0)*r,Math.sin(a0)*r,Math.cos(a1)*r,Math.sin(a1)*r);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fill();ctx.restore();}
function glow(x,y,r,col,al=1){r=Math.max(.5,r);ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',al));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();}
function ring(x,y,r,wd,col,al,ry=1,rot=0){r=Math.max(2,r);wd=Math.max(1,wd);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(al);ctx.translate(x,y);ctx.rotate(rot);ctx.scale(1,ry);
  const g=ctx.createRadialGradient(0,0,Math.max(1,r-wd),0,0,r+wd*.3);g.addColorStop(0,col.replace('A',0));g.addColorStop(.72,col.replace('A',.9));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r+wd*.3,0,7);ctx.fill();ctx.restore();}
function sparks(x,y,t,n,seed,len=140,col='255,250,235'){const R=rng(seed);ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(let i=0;i<n;i++){const a=R()*6.283,v=lerp(.4,1,R()),d=len*v*eo(t),d0=d*.55;const al=1-clamp(t);ctx.strokeStyle=`rgba(${col},${al})`;ctx.lineWidth=2+R()*3*(1-t);ctx.beginPath();ctx.moveTo(x+Math.cos(a)*d0,y+Math.sin(a)*d0*.8);ctx.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d*.8);ctx.stroke();}ctx.restore();}
function debris(x,y,t,n,seed,spread=420,up=520){const R=rng(seed);ctx.save();
  for(let i=0;i<n;i++){const a=-Math.PI/2+(R()-.5)*2.6,v=lerp(.3,1,R()),sz=lerp(5,26,R()*R());
    const px=x+Math.cos(a)*spread*v*t*1.6,py=y+Math.sin(a)*up*v*t+600*t*t*v;const rot=R()*6+t*8*(R()-.5);const al=1-clamp((t-.5)*2);
    ctx.save();ctx.translate(px,py);ctx.rotate(rot);ctx.globalAlpha=al;ctx.fillStyle=`rgb(${60+R()*40|0},${55+R()*35|0},${52+R()*30|0})`;
    ctx.beginPath();ctx.moveTo(-sz,-sz*.4);ctx.lineTo(sz*.2,-sz*.8);ctx.lineTo(sz,sz*.2);ctx.lineTo(-sz*.3,sz*.7);ctx.closePath();ctx.fill();ctx.restore();}ctx.restore();}
function dust(x,y,t,n,seed,sz=160){const R=rng(seed);ctx.save();
  for(let i=0;i<n;i++){const a=R()*6.283,d=R()*sz*(.4+t*1.6),r=lerp(40,120,R())*(.6+t*1.4),px=x+Math.cos(a)*d,py=y+Math.sin(a)*d*.55-t*80*R();
    const al=.30*(1-clamp(t))*Math.min(1,t*8+.3);const g=ctx.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(120,125,135,${al})`);g.addColorStop(1,'rgba(120,125,135,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();}ctx.restore();}
function speedLines(t,cx,cy,n,seed,al=.55){const R=rng(seed);ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const a=R()*6.283,r0=lerp(300,620,R())+((t*900)%200)*0.0,r1=r0+lerp(160,520,R());ctx.strokeStyle=`rgba(225,240,255,${al*lerp(.3,1,R())})`;ctx.lineWidth=1+R()*3;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.65);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.65);ctx.stroke();}ctx.restore();}
function vignette(a=.5){const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
// embers (foreground parallax)
function embers(t,camx,camz){const R=rng(777);ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<46;i++){const bx=R()*W,by=R()*H,sp=lerp(20,70,R()),ph=R()*6.28,sz=lerp(1.5,4.5,R());const x=((bx-camx*1.5*.12+Math.sin(t*1.5+ph)*30)%(W+80)+W+80)%(W+80)-40,y=((by-t*sp*3)%H+H)%H;ctx.fillStyle=`rgba(255,${150+R()*60|0},70,${.5*R()+.2})`;ctx.beginPath();ctx.arc(x,y,sz,0,7);ctx.fill();}ctx.restore();}

// ---------- timeline (world-time seconds) ----------
const SHOT=[ // [start,end,type]
 [0.00,0.92,'wide'],[0.92,1.46,'low'],[1.46,2.09,'ots'],[2.09,6.0,'wide']];
const HIT=50/FPS;           // 3-frame exposure at frames 50,51,52 (hit-stop)
const S=0.62, GY=880;       // sprite scale, ground y
// Zhao: [t,x,y,s]
const ZX=[[0,560,GY,S],[0.30,610,GY,S],[0.55,660,GY,S],[0.80,800,GY,S],[0.92,830,GY,S],[2.09,830,GY,S],[2.6,820,GY,S],[3.2,800,GY,S],[3.5,720,GY+30,S+0.03],[3.85,860,GY+30,S+0.03],[4.3,870,GY+10,S+0.015],[5.0,880,GY+10,S+0.015],[6.0,890,GY+10,S+0.015]];
const ZP=[[0,'zhao-parry'],[0.28,'zhao-feint'],[0.58,'zhao-exchange'],[0.84,'zhao-follow'],[1.46,'zhao-follow'],[2.09,'zhao-impact'],[2.75,'zhao-follow'],[3.15,'zhao-approach'],[3.45,'zhao-feint'],[3.80,'zhao-exchange'],[4.10,'zhao-impact'],[4.55,'zhao-follow'],[4.85,'zhao-exchange'],[5.15,'zhao-impact'],[5.55,'zhao-follow'],[5.8,'zhao-impact']];
// Guan
const GX=[[0,1560,GY,S],[0.30,1250,GY,S],[0.55,1290,GY,S],[0.92,1320,GY,S],[2.09,1300,GY,S],[2.14,1330,GY-10,S],[2.45,1500,GY-90,0.50],[2.95,1620,GY-130,0.42],[3.25,1632,GY-132,0.41],[3.45,1520,GY-60,0.50],[3.85,1290,GY,S],[4.3,1300,GY,S],[5.0,1290,GY,S],[6.0,1290,GY,S]];
const GP=[[0,'guan-exchange'],[0.30,'guan-feint'],[0.80,'guan-approach'],[2.14,'guan-follow'],[3.0,'guan-follow'],[3.28,'guan-aftermath'],[3.42,'guan-exchange'],[4.2,'guan-feint'],[4.55,'guan-exchange'],[4.95,'guan-feint'],[5.3,'guan-exchange'],[5.7,'guan-feint']];
// camera: [t, cx, cy, zoom, rollDeg]
const CAM=[[0,880,600,1.10,0],[0.92,960,590,1.20,0.4],
 [2.09,830,570,1.35,0],[2.30,930,600,1.32,-1.0],[2.95,1380,690,1.00,0.8],[3.30,1420,680,1.02,1.2],
 [3.50,1180,640,1.10,0],[3.9,1060,620,1.16,-0.8],[4.3,1020,600,1.14,-1.2],[6.0,1260,590,1.22,1.4]];

function camAt(t){return kf(CAM,t);}
function shotAt(t){for(const s of SHOT)if(t>=s[0]&&t<s[1])return s[2];return 'wide';}

// FX that live in world space (wide shot)
function worldFX(t,f){
  const zc=kf(ZX,t),gc=kf(GX,t);
  // --- A: guandao sweep arc + deflect spark (0.14-0.6)
  if(t>.10&&t<.62){const u=(t-.10)/.52;arc(gc[0]-120,GY-300,360,Math.PI*0.80,Math.PI*1.30,34*(1-u*.4),'rgba(120,240,150,0)','rgba(255,225,130,.95)',(1-u*.9)*.8,1);}
  if(t>=.30&&t<.62){sparks(960,GY-360,(t-.30)/.32,16,11,120,'255,250,225');glow(960,GY-360,160*(1-(t-.30)/.40),'rgba(210,235,255,A)',.9);}
  // --- slide-in dust (0.55-0.95)
  if(t>.55&&t<1.4)dust(zc[0]-60,GY+8,(t-.55)/.85,7,21,110);
  // short strike glint white (0.80-1.0)
  if(t>.78&&t<1.0){const u=(t-.78)/.22;arc(zc[0]+300,GY-330,240,-0.6,0.5,50*(1-u*.5),'rgba(255,255,255,0)','rgba(190,225,255,.95)',1-u,1);sparks(1090,GY-380,u,12,31,100,'230,245,255');}
  // --- D: shockwave after hit (HIT .. )
  const th=t-2.09;
  if(th>=0&&th<1.3){
    const u=th/1.3, tipx=1110,tipy=GY-290;
    // heavy pressure layer (dense, near sword tip, short) then wide shockwave
    if(th<.25){const p=eo(th/.25);glow(tipx,tipy,230*(.6+p),'rgba(210,235,255,A)',.95*(1-p*.6));}
    // ground shock ring (flat) – cool white / silver blue
    ring(tipx,GY+10,60+1500*eo(u),90*(1-u*.7)+20,'rgba(190,225,255,A)',1-u,.20);
    ring(tipx,GY+10,40+1100*eo(clamp(u*1.15)),60*(1-u*.7)+10,'rgba(255,255,255,A)',(1-u)*.8,.20);
    // vertical pressure disc (big circle rim facing camera, angled)
    ring(tipx+80,tipy,80+900*eo(u),60*(1-u*.8)+10,'rgba(170,215,255,A)',(1-u)*.5,1.0);
    // swirling arcs around shock edge (swirl)
    for(let k=0;k<4;k++){const r=240+k*80+900*eo(u),a0=u*5+k*1.57;arc(tipx+80,tipy+60,r,a0,a0+0.9,26,'rgba(170,215,255,0)','rgba(235,248,255,.8)',(1-u)*.8,.55);}
    // dust trail along floor in the blast direction
    dust(1250+330*eo(clamp(u*1.6)),GY-20,u,12,41,230);
    sparks(tipx,tipy,clamp(th/.5),30,51,400,'230,245,255');
  }
  // --- wall hit (t 2.92..3.6)
  const tw=t-2.93;
  if(tw>=0&&tw<1.2){const u=tw/1.2,hx=1640,hy=GY-150;
    if(tw<.22)glow(hx,hy,260*(1-tw/.22)+60,'rgba(255,240,210,A)',.95);
    ring(hx,hy,30+520*eo(clamp(u*1.4)),50*(1-u)+8,'rgba(255,245,225,A)',(1-clamp(u*1.3))*.9,.55);
    debris(hx,hy,u,34,61,520,520);
    dust(hx,hy+30,u,16,71,260);
    // fragmented wall chunks flying out of wall
    debris(hx-30,hy-50,clamp(u*1.2),14,81,300,380);
  }
  // --- Guan rebound arc (3.35-3.95): green-gold crescent leading
  if(t>3.36&&t<3.95){const u=(t-3.36)/.59,g=kf(GX,t);arc(g[0]-70,g[1]-g[2]*400,g[2]*520,Math.PI*0.55,Math.PI*1.45,46*g[2]/.62*(1-u*.3),'rgba(110,240,150,0)','rgba(255,228,140,.95)',1-u*.5,1);
    dust(g[0]+80,g[1]+4,u,6,91,160);}
  // --- Zhao sidestep streak + meet (3.45-3.95)
  if(t>3.55&&t<3.95){const u=(t-3.55)/.40;arc(zc[0]+260,GY-300,260,-0.8,0.6,56*(1-u*.4),'rgba(255,255,255,0)','rgba(190,225,255,.95)',1-u*.7,1);}
  // --- F: clash at 3.88 onward (no second exposure frame, just spark + ring)
  const tc=t-3.88;
  if(tc>=0){
    const cx=1075,cy=GY-320;
    const burst=t=>0;
    if(tc<.45){sparks(cx,cy,tc/.45,28,101,260,'255,244,205');glow(cx,cy,220*(1-tc/.45)+40,'rgba(230,240,255,A)',.9);}
    if(tc<1.3)ring(cx,GY+10,40+900*eo(tc/1.3),60*(1-tc/1.3)+8,'rgba(200,230,255,A)',(1-tc/1.3)*.85,.20);
    // continued exchange: periodic crossing arcs (white vs green-gold) in the held two-shot
    const per=(tt,ph)=>{const u=((tt-ph)%0.9+0.9)%0.9/0.9;return u};
    const u1=per(t,3.95),u2=per(t,4.4);
    arc(cx-40,cy+30,300,-0.9+u1*0.5,0.2+u1*0.5,34*(1-u1),'rgba(255,255,255,0)','rgba(200,230,255,.95)',(1-u1)*.8,1);
    arc(cx+60,cy+90,330,Math.PI*0.8+u2*0.4,Math.PI*1.3+u2*0.4,26*(1-u2),'rgba(110,240,150,0)','rgba(255,228,140,.95)',(1-u2)*.8,1);
    if(t>4.2){const k=((t-4.2)%0.55)/0.55;sparks(cx+(Math.floor((t-4.2)/0.55)%2?30:-20),cy+40,k,10,111+Math.floor((t-4.2)/0.55),150,'255,245,215');}
  }
}
function renderBeat(t,f){
  const tq=Math.floor(t*12+1e-6)/12;   // characters on twos
  const shot=shotAt(t);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(shot==='wide'){
    const cam=camAt(t);
    // camera shake: wall hit and impact
    let sh=0;const th=t-2.09,tw=t-2.93;if(th>=0&&th<.3)sh=18*(1-th/.3);if(tw>=0&&tw<.4)sh=Math.max(sh,22*(1-tw/.4));if(t>3.88&&t<4.15)sh=Math.max(sh,12*(1-(t-3.88)/.27));
    const R=rng(f*7+3);const cc=[cam[0]+(R()-.5)*sh,cam[1]+(R()-.5)*sh,cam[2],cam[3]];
    worldBegin(cc);
    const z=kf(ZX,tq),g=kf(GX,tq);
    shadow(z[0]+30,z[1]+4,230*z[2]/S,.55);shadow(g[0]-10,g[1]+4,230*g[2]/S,.55);
    // draw far one first (smaller y first)
    const zs={n:pose(ZP,tq),x:z[0],y:z[1],s:z[2]},gs={n:pose(GP,tq),x:g[0],y:g[1],s:g[2]};
    // slight squash on landing/hit
    const list=[gs,zs].sort((a,b)=>a.y-b.y);
    for(const o of list)sprite(o.n,o.x,o.y,o.s);
    worldFX(t,f);
    worldEnd();
    embers(t,cam[0],cam[2]);
    // edge shock swirl in screen space (as camera retreats)
    const th2=t-2.09;if(th2>0&&th2<1.2){const u=th2/1.2;ctx.save();ctx.globalCompositeOperation='lighter';
      for(let k=0;k<5;k++){const a0=-1.2+k*0.35+u*4,rr=H*.78+k*40;ctx.strokeStyle=`rgba(205,230,255,${(1-u)*.5})`;ctx.lineWidth=5-k*.6;ctx.beginPath();ctx.ellipse(W*.5,H*.5,W*.52+k*30,rr,0,a0,a0+0.7);ctx.stroke();}ctx.restore();}
    if(th2>0&&th2<.7)speedLines(t,W*.3,H*.55,28,5+f,.5*(1-th2/.7));
    vignette(.45);
  }else if(shot==='low'){
    const u=(t-.92)/.54, z=lerp(1.0,1.20,eo(u));
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-lerp(960,1020,u),-lerp(540,520,u));
    ctx.drawImage(IMG.low,0,0,W,H);
    // glints: sword edge flash then guandao crescent
    const fx=(x,y)=>{};
    arc(560,430,420,-1.35,-0.35,30,'rgba(255,255,255,0)','rgba(200,230,255,.95)',clamp(1-Math.abs(u-.35)*3)*.9,1);
    arc(1280,480,360,Math.PI*0.85,Math.PI*1.30,24,'rgba(110,240,150,0)','rgba(255,228,140,.95)',clamp(1-Math.abs(u-.7)*3)*.85,1);
    glow(1150,470,200,'rgba(235,245,255,A)',clamp(u*1.2-.4)*.8);
    ctx.restore();
    speedLines(t,W*.5,H*.5,14,9+f,.28*u);
    vignette(.5);
  }else if(shot==='ots'){
    const u=(t-1.46)/(2.09-1.46), z=lerp(1.0,1.55,eio(u*.9+.1*u));
    const sh=(u>.85)?6*Math.sin(f*2.2):0;
    ctx.save();ctx.translate(W/2+sh,H/2);ctx.scale(z,z);ctx.translate(-lerp(900,1190,u),-lerp(520,530,u));
    ctx.drawImage(IMG.ots,0,0,W,H);
    // pressure gathering: converging arcs on sword tip (1106,628) in image space
    if(u>.35){const p=(u-.35)/.65;glow(1106,628,120+220*(1-p),'rgba(210,235,255,A)',.35+.55*p);
      for(let k=0;k<3;k++)arc(1106,628,200*(1-p)+60+k*55,-2.2+p*3+k,-0.9+p*3+k,24,'rgba(190,225,255,0)','rgba(240,250,255,.95)',.6*p,1);}
    // guard lock spark (shaft)
    if(u>.55){const p=(u-.55)/.45;sparks(1150,520,(p*3)%1,10,200+Math.floor(p*3),110,'255,245,215');}
    ctx.restore();
    speedLines(t,W*.55,H*.5,32,13+(f%3),.30+.55*u);
    vignette(.55);
  }
}

// =====================================================================
//  30 s engine  (global world-time t in seconds; 24 fps; 720 frames)
// =====================================================================
const GROUND=880;
const T=rows=>rows.map(r=>{const a=r.slice();for(let k=r.length;k<7;k++)a.push(k===3?S:(k===4?0:1));return a;});
function poseF(list,t){let e=list[0];for(const p of list){if(t>=p[0]-1e-6)e=p;}return [e[1],!!e[2]];}
function w2s(cam,x,y){const [cx,cy,z,roll]=cam;const px=(x-cx)*z,py=(y-cy)*z;const r=roll*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return [W/2+px*c-py*s,H/2+px*s+py*c];}
const HOLDS=[338,713];
function wfOf(F){let w=F;if(F>=341)w-=3;else if(F>=338)w-=(F-338);   // hold 1 (beat impact): world time lags 3 frames after
  if(F>=713&&F<716)w-=(F-713);                                          // hold 2 (final clash): 3 exposure frames freeze world time
  return w;}
function sprite(name,x,y,s,o={}){const im=IMG[name],m=meta[name];if(!im)return;
  ctx.save();ctx.translate(x,y);
  if(o.rot){const py=-0.45*im.height*s;ctx.translate(0,py);ctx.rotate(o.rot*Math.PI/180);ctx.translate(0,-py);}
  ctx.scale((o.flip?-1:1)*(o.sx||1),(o.sy||1));
  ctx.drawImage(im,-m.ax*s,-m.ay*s,im.width*s,im.height*s);ctx.restore();}
function worldBegin(cam,o={}){
