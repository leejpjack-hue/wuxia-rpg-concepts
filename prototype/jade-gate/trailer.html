<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d0e">
  <title>四人の刃 — 10秒トレーラー</title>
  <link rel="stylesheet" href="trailer.css">
  <style>
    /* Harmonize trailer header brand with game UI and ensure smooth hardware composition */
    .brand { display: flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: 2px; }
    .brand small { display: block; font-size: 8px; color: var(--muted); letter-spacing: 3px; margin-top: 3px; }
    .seal { font-family: serif; font-size: 29px; border: 1px solid var(--gold); color: var(--gold); width: 40px; height: 44px; display: grid; place-content: center; }
    .screen { cursor: pointer; contain: layout style paint; }
    .camera, .backdrop, .landscape, .wanderer, .foreground, .hero-line, .duel-card, .closeup, .traveler, .title-art {
      will-change: transform;
    }
    .cover { cursor: pointer; transition: opacity .25s ease, background .25s ease; }
    .cover:hover .play-circle { transform: scale(1.08); border-color: #fff; color: #fff; box-shadow: 0 0 20px var(--gold); }
    .play-circle { transition: transform .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease; }
    .title-lockup p { font-size: clamp(9px, 1.1vw, 14px); letter-spacing: .3em; color: var(--gold); margin: 0 0 10px; text-transform: uppercase; }
    .title-lockup h1 { font: 500 clamp(32px, 7vw, 92px)/1.05 Georgia, "Hiragino Mincho ProN", serif; letter-spacing: .08em; margin: 0 0 18px; }
    .title-lockup span:last-child { font-size: clamp(11px, 1.3vw, 18px); letter-spacing: .25em; color: #eeddbb; }
    .duel-card span { font-size: clamp(9px, 1.3vw, 17px); letter-spacing: .1em; text-align: center; }
    .duel-card small { font-size: clamp(7px, .9vw, 11px); letter-spacing: .14em; text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <a class="brand" id="brand" href="./">
      <span class="seal">四</span>
      <span id="brand-text"><span>四人の刃</span><small>武侠カードRPG</small></span>
    </a>
    <a id="back" href="./">ゲームへ ↗</a>
  </header>
  <main>
    <div class="editorial"><p id="eyebrow">江湖の物語 · 公式ティーザー</p><span>01 / 10 SECONDS</span></div>
    <section id="screen" class="screen" aria-label="ゲームトレーラー" data-scene="title">
      <div class="letterbox top"></div><div class="letterbox bottom"></div>
      <div id="camera" class="camera">
        <div class="scene" data-shot="pass"><img class="backdrop" src="assets/arena.png" alt=""><div class="mist"></div><img id="wanderer" class="wanderer" src="assets/zhao-yun-sprite.png" alt=""><img class="foreground" src="assets/bamboo-thicket-blocker.png" alt=""><span class="vertical-script">山河有盡<br>寸刃不移</span></div>
        <div class="scene" data-shot="legends"><img class="backdrop" src="assets/bamboo-river.png" alt=""><div class="hero-line"><img src="assets/guan-yu-sprite.png" alt=""><img src="assets/hu-sanniang-sprite.png" alt=""><img src="assets/zhao-yun-sprite.png" alt=""><img src="assets/qin-liangyu-sprite.png" alt=""><img src="assets/lu-bu-sprite.png" alt=""></div></div>
        <div class="scene" data-shot="duel"><img class="backdrop" src="assets/mount-canglan.png" alt=""><div class="duel-grid"></div><div class="duel-card hero"><span id="duel-hero-name">趙雲 · 白龍</span><div class="fighter-frame"><img id="duel-hero" src="assets/zhao-yun-sprite.png" alt="趙雲"></div><small id="duel-hero-skill">龍の突撃 / DRAGON RUSH</small></div><span class="versus" id="duel-versus">對</span><div class="duel-card rival"><span id="duel-rival-name">呂布 · 飛将</span><div class="fighter-frame"><img id="duel-rival" src="assets/lu-bu-rival-sprite.png" alt="呂布"></div><small id="duel-rival-skill">SKYBREAKER</small></div><div class="qi-aura"></div><div class="speed-lines"></div><div class="slash"></div><div class="shock-ring"></div><div class="impact-word" id="impact-word">蒼龍破</div></div>
        <div class="scene" data-shot="journey"><img class="landscape river" src="assets/bamboo-river.png" alt=""><img class="landscape mountain" src="assets/mount-canglan.png" alt=""><img class="landscape citadel" src="assets/meridian-citadel.png" alt=""><img class="traveler" src="assets/zhao-yun-sprite.png" alt=""><div class="route-line"></div><span id="location" class="location"></span></div>
        <div class="scene title-scene" data-shot="title"><img class="backdrop" src="assets/bamboo-river.png" alt=""><div class="title-art"><img src="assets/lu-zhishen-sprite.png" alt=""><img src="assets/zhao-yun-sprite.png" alt=""><img src="assets/hu-sanniang-sprite.png" alt=""></div><div class="title-lockup"><span class="title-seal">四</span><p id="end-kicker">BLADES OF THE FOUR</p><h1 id="end-title">四人の刃</h1><span id="end-line">今、江湖へ。</span></div></div>
        <div id="closeup" class="closeup" aria-hidden="true"><img data-focus="zhao-yun" src="assets/zhao-yun.png" alt=""><img data-focus="hu-sanniang" src="assets/hu-sanniang.png" alt=""><img data-focus="lu-zhishen" src="assets/lu-zhishen.png" alt=""><div class="portrait-shade"></div><div class="portrait-rule"></div><div class="portrait-caption"><span id="portrait-role"></span><strong id="portrait-name"></strong></div></div>
      </div>
      <div class="impact"></div><div class="cut-wipe"></div>
      <div class="vignette"></div><div id="embers" class="embers" aria-hidden="true"></div>
      <div id="copy" class="copy"><p id="shot-kicker"></p><h2 id="shot-title"></h2></div>
      <p id="subtitle" class="subtitle"></p>
      <div class="film-meta"><span>四俠傳</span><span id="film-time">00:00 / 00:10</span></div>
      <button id="cover" class="cover" aria-label="再生"><span class="play-circle" id="cover-icon">▶</span><span id="cover-label">音声付きで再生</span><small id="cover-hint">10 SEC · MUSIC + VOICE</small></button>
    </section>
    <div class="transport">
      <button id="play" class="primary" disabled>準備中…</button>
      <div class="track" role="progressbar" aria-label="再生位置" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span id="progress"></span></div>
      <span id="timer">00:00 / 00:10</span>
      <button id="mute" aria-pressed="false">音声：入</button>
      <label><span class="sr-only">Language / 言語</span><select id="trailer-language"><option value="ja">日本語</option><option value="en">English</option></select></label>
    </div>
    <div class="below"><p id="description">刃が交わる、その一瞬を。探索とカード決闘で紡ぐ武侠RPG。</p><a id="cta" href="./">物語を始める ↗</a></div>
    <p id="status" role="status" aria-live="polite"></p>
    <details><summary id="transcript-label">ナレーション全文</summary><p id="transcript"></p></details>
  </main>
  <footer><span>BLADES OF THE FOUR</span><span id="footer-copy">十六の伝説 · 四つの章 · 一つの誓い</span></footer>
  <script type="module" src="trailer.js"></script>
</body>
</html>
