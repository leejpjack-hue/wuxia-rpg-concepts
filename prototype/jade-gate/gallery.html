<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Art Collection — Blades of the Four">画廊 — 四人の刃</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><span class="seal">四</span><span><span data-i18n="BLADES OF THE FOUR">四人の刃</span><small data-i18n="THE ART COLLECTION">画廊</small></span></a><a href="./" data-i18n="← Return to game">← ゲームに戻る</a></header><main><p class="eyebrow" data-i18n="THE WORLD BEHIND THE LEGENDS">伝説を描く世界</p><h1 class="gallery-title" data-i18n="From brushstroke to battle.">一筆から、戦場へ。</h1><p class="lede"><span id="asset-count"></span><span data-i18n="game images across the original build and new hero collection. Select any image to open its full-resolution source.">枚のゲーム画像。画像を選ぶと原寸で表示します。</span><br><span data-i18n="Character sheets are visual modeling references; final geometry and rigs remain to be built.">設定画はモデリング用の参考資料です。3Dモデルとリグは今後制作予定です。</span></p><div id="collection"></div><p><a href="docs/asset-manifest.json" data-i18n="View all generation prompts ↗">画像生成プロンプト一覧 ↗</a></p></main><script type="module">
import {localizeDocument, translate} from './src/locales/i18n.js';
import assetManifest from './docs/asset-manifest.json' with {type:'json'};
import {SaveStore} from './src/platform/save-store.js';
let storage; try {storage=window.localStorage;} catch {}
const language=new SaveStore(storage).load().settings.language;
const t=text=>translate(text,language);
localizeDocument(document,language);
import {HEROES, SPRITE_HEROES, TURNAROUND_HEROES} from './core.js';
const byId=id=>HEROES.find(h=>h.id===id);
const listed=HEROES.filter(h=>!h.hidden);
const groups=[['The legends',listed.map(h=>[h.id,h.name])],['Gameplay sprites',SPRITE_HEROES.map(id=>[`${id}-sprite`,byId(id).name])],['Modeling reference sheets',TURNAROUND_HEROES.map(id=>[`${id}-turnaround`,`${byId(id).name} · front / side / back`])],['The Ashen Banner',[['guard-sprite','Ashen guard'],['archer-sprite','Ashen archer'],['warden-sprite','The Ashen Warden']]],['The mountain pass',[['arena','Jade Gate courtyard'],['bamboo-roam','Bamboo river ford'],['bamboo-crossing-ground','Moonlit bamboo ground'],['bamboo-maze-natural','Natural forest trail'],['canglan-terrace-ground','Canglan stone terrace'],['mount-canglan','Mount Canglan terrace']]],['Act II & III rivals',[['shadow-assassin-sprite','Shadow Assassin'],['skiff-archer-sprite','Skiff Archer'],['night-heron-sprite','The Night Heron'],['canglan-monk-sprite','Canglan Iron Monk'],['lu-bu-rival-sprite','Lü Bu · Ashen Oath']]]];
const expansionLabels = { 'sig-counter': 'Counter-cut emblem', 'sig-bleedCut': 'Crimson blade emblem', merchant: 'Wandering merchant', 'meridian-citadel': 'The Imperial Meridian Citadel', 'jade-sentinel-sprite': 'Jade Sentinel', 'meridian-acolyte-sprite': 'Meridian Acolyte' };
const shown = new Set(groups.flatMap(([,items])=>items.map(([id])=>id)));
groups.push(['Expansion artwork',assetManifest.filter(row=>row.expansion && !shown.has(row.id)).map(row=>[row.id,expansionLabels[row.id] || row.id.replaceAll('-',' ')])]);
document.getElementById('asset-count').textContent=groups.reduce((total,[,items])=>total+items.length,0);
document.getElementById('collection').innerHTML=groups.map(([title,items])=>`<h2 style="font:26px Georgia;margin-top:40px">${t(title)}</h2><div class="gallery-grid">${items.map(([id,name])=>`<figure><a href="assets/${id}.png" target="_blank"><img src="assets/${id}.png" alt="${t(name)}" loading="lazy"><figcaption>${t(name)} ↗</figcaption></a></figure>`).join('')}</div>`).join('');
</script></body></html>
