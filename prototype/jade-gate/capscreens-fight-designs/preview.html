<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fight designs</title>
<link rel="stylesheet" href="fight-designs.css">
</head>
<body>
<main>
  <h1>Fight designs</h1>
  <p class="lede">V1 animatic. The camera crops the baked plates: wide wind-up, a short push on the charge, a hard cut to the tip clash, then a medium-wide aftermath. Zhao Yun’s weapon in the copy is a jian. Nothing here redraws the frames.</p>
  <div id="cards" class="cards"></div>
  <div id="stage" class="stage" data-beat="standoff">
    <div id="camera" class="camera">
      <img id="plate" class="plate" alt="">
    </div>
    <img id="insert" class="insert" alt="" hidden>
    <div class="speed-lines"></div>
    <div id="flash" class="flash"></div>
    <div id="impact-frame" class="impact-frame"></div>
    <p id="cam-read" class="cam-read"></p>
  </div>
  <nav>
    <button id="play" type="button">Play</button>
    <span id="beats"></span>
  </nav>
  <p id="status" role="status"></p>
  <a href="../">Return to game</a>
</main>
<script src="fight-designs.js"></script>
</body>
</html>
